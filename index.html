<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Might &amp; Magic — Cards</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#EEEDF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131220" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Palette and type follow class-bible.html so the two read as one project. */
:root{
  --ground:#EEEDF2; --surface:#FBFAFD; --surface-alt:#E5E3EC;
  --ink:#1A1826; --ink-soft:#423E55; --muted:#6B6879;
  --rule:rgba(26,24,38,.13); --rule-strong:rgba(26,24,38,.26); --chip:rgba(26,24,38,.06);
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
  --body:"Karla","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#131220; --surface:#1C1A2B; --surface-alt:#242135;
  --ink:#E9E7F1; --ink-soft:#C3BFD6; --muted:#9A96AE;
  --rule:rgba(233,231,241,.16); --rule-strong:rgba(233,231,241,.32); --chip:rgba(233,231,241,.08);
}}
:root[data-theme="dark"]{
  --ground:#131220; --surface:#1C1A2B; --surface-alt:#242135;
  --ink:#E9E7F1; --ink-soft:#C3BFD6; --muted:#9A96AE;
  --rule:rgba(233,231,241,.16); --rule-strong:rgba(233,231,241,.32); --chip:rgba(233,231,241,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased}

/* ---------- chrome ---------- */
header.top{padding:1.6rem clamp(1rem,4vw,2.5rem) .9rem;display:flex;flex-direction:column;gap:.45rem}
.titlerow{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap}
.badge{font-family:var(--mono);font-size:.7rem;font-weight:700;letter-spacing:.1em;
  border:1px solid var(--rule-strong);border-radius:999px;padding:.16rem .55rem;color:var(--ink-soft);background:var(--chip)}
.offline{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1px dashed var(--rule-strong);border-radius:999px;padding:.14rem .5rem}
.spectrum{height:5px;border-radius:3px;background:linear-gradient(to right,#D3082F,#F5B202,#2A8934,#0189C4,#81377B,#9FA8B4)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,4vw,2.6rem);margin:.5rem 0 0;letter-spacing:-.02em}
.sub{color:var(--ink-soft);margin:0;max-width:62ch}
.sub a{color:inherit}

.bar{position:sticky;top:0;z-index:10;background:var(--surface);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule-strong);
     padding:.7rem clamp(1rem,4vw,2.5rem);display:flex;flex-wrap:wrap;gap:.55rem .7rem;align-items:center}
.bar label{font-family:var(--mono);font-size:.62rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.2rem}
.field{display:flex;flex-direction:column}
select,input[type=search],button{font-family:var(--body);font-size:.92rem;color:var(--ink);background:var(--ground);
     border:1px solid var(--rule-strong);border-radius:4px;padding:.36rem .5rem}
input[type=search]{min-width:15rem}
button{cursor:pointer;font-weight:700}
button:hover{background:var(--surface-alt)}
button.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
:is(select,input,button):focus-visible{outline:2px solid #3256C6;outline-offset:2px}
.count{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-left:auto}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem;
      padding:1.2rem clamp(1rem,4vw,2.5rem)4rem}
.empty{padding:3rem clamp(1rem,4vw,2.5rem);color:var(--muted)}

/* ---------- the card ----------
   Structure, top to bottom: a title bar, the art panel, then a stat line where
   power and HP flank the card type, then the rules box. Cost stacks vertically
   in the top-left corner. */
.card{aspect-ratio:2.5/3.5;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;
      color:#fff;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.25);border:1px solid rgba(0,0,0,.35)}

/* the title, centred on its own band */
.title{color:#fff;text-align:center;padding:.28rem .45rem .28rem 2.45rem;
      font-family:var(--display);font-weight:700;font-size:.8rem;line-height:1.14;
      letter-spacing:-.01em;text-shadow:0 1px 2px rgba(0,0,0,.55);
      border-bottom:1px solid rgba(0,0,0,.35);
      /* names run longer than ids, so wrap rather than truncate */
      text-wrap:balance;min-height:1.9rem;display:grid;align-content:center}
.title .uniq{color:#F5E6B0;margin-right:.15em}

/* cost: a vertical column in the top-left, overlapping the bars above the art */
.pips{position:absolute;top:.22rem;left:.28rem;z-index:3;display:flex;flex-direction:column;gap:.14rem}
.pip{width:1.5rem;height:1.5rem;border-radius:6px;display:grid;place-items:center;
     font-family:var(--display);font-weight:700;font-size:.86rem;line-height:1;color:#fff;
     border:1.5px solid rgba(255,255,255,.92);box-shadow:0 1px 2px rgba(0,0,0,.45)}
.pip.generic{background:#F2EFE6;color:#141018;border-color:rgba(0,0,0,.35)}

.art{flex:1 1 auto;min-height:0;background:rgba(0,0,0,.18);display:grid;place-items:center;
     overflow:hidden;position:relative}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid;place-items:center;gap:.15rem;opacity:.45}
.ph .cid{font-family:var(--mono);font-size:.48rem;letter-spacing:.08em}
.ph .glyph{font-size:1.8rem;line-height:1}

/* power and HP flank a centred line, sitting across the art's lower edge */
.statline{position:relative;display:grid;grid-template-columns:2rem 1fr 2rem;align-items:center;
     justify-items:center;gap:.3rem;background:rgba(255,255,255,.9);color:#2A2536;
     padding:.22rem .32rem;min-height:1.5rem;
     /* content height only: with flex-shrink allowed, a spell's empty stat slots
        let this band take the slack that belongs to the art */
     flex:0 0 auto}
.statline .mid{text-align:center;font-family:var(--body);font-weight:700;font-size:.6rem;
     letter-spacing:.1em;text-transform:uppercase;line-height:1.2;color:#2A2536}
.statline .kws{display:block;font-family:var(--mono);font-weight:400;font-size:.5rem;
     letter-spacing:.02em;text-transform:none;color:#5A5468;margin-top:.1em}
.stat{font-family:var(--display);font-weight:700;font-size:.95rem;line-height:1;
     display:grid;place-items:center;width:2rem;height:2rem;color:#fff;
     text-shadow:0 1px 2px rgba(0,0,0,.5);
     /* clip-path carries the silhouette, so definition comes from a drop-shadow:
        a border would be clipped away with the corners */
     filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45))}
/* attack: a blade point, driving downward */
.stat.pow{background:#B33127;clip-path:polygon(50% 0,100% 30%,78% 100%,22% 100%,0 30%)}
/* health: a shield, closing underneath */
.stat.hp{background:#27753F;clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%)}
/* an upgrade modifies the unit it attaches to, so its numbers sit in the
   bottom corners of the card rather than in the middle stat line */
.stat.corner{position:absolute;bottom:.26rem;z-index:3}
.stat.corner.l{left:.3rem}
.stat.corner.r{right:.3rem}
.card.up .rules{padding-bottom:2.1rem}

.rules{flex:0 0 31%;background:#F4F2EC;color:#1A1826;line-height:1.34;padding:.42rem .48rem;
     overflow:hidden;
     /* --fit is set per card by the fitter below; print scales from the same
        factor so the sheet matches what the grid shows */
     font-size:calc(.6rem * var(--fit, 1))}
.rules p{margin:0 0 .3em}
.rules p:last-child{margin:0}
.credit{background:rgba(0,0,0,.5);font-family:var(--mono);font-size:.46rem;letter-spacing:.1em;
     padding:.16rem .45rem;color:rgba(255,255,255,.72)}

/* ---------- print: real 2.5in x 3.5in cards, 9 to a letter page ---------- */
@page{size:letter portrait;margin:.2in}
@media print{
  :root{--ink:#000;--ink-soft:#000}
  header.top,.bar,.empty,.noprint{display:none!important}
  body{background:#fff}
  .grid{display:grid;grid-template-columns:repeat(3,2.5in);gap:0;padding:0;justify-content:center}
  .card{width:2.5in;height:3.5in;aspect-ratio:auto;border-radius:0;box-shadow:none;
        outline:.5pt dashed rgba(0,0,0,.35);outline-offset:-.5pt;break-inside:avoid;page-break-inside:avoid;
        -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rules{font-size:calc(6.6pt * var(--fit, 1));line-height:1.26;flex:0 0 31%;overflow:hidden;padding:.06in .07in}
  .art{flex:1 1 auto;min-height:0}
      .title{padding:.03in .05in .03in .33in;font-size:8pt;min-height:.26in}
    .pips{top:.025in;left:.03in}
  .pip{width:.26in;height:.26in;font-size:9pt;border-radius:.05in}
  .statline{padding:.025in .03in;min-height:.16in}
  .statline .mid{font-size:5.6pt}
  .statline .kws{font-size:4.8pt}
  .stat{font-size:10pt;width:.30in;height:.30in}
  .stat.corner{bottom:.04in}
  .stat.corner.l{left:.05in}
  .stat.corner.r{right:.05in}
  .card.up .rules{padding-bottom:.34in}
  .credit{font-size:4.4pt;padding:.015in .05in}
  .meta{font-size:6pt}
  .card .head{font-size:7pt}
}
</style>
</head>
<body>

<header class="top">
  <div class="spectrum"></div>
  <div class="titlerow"><h1>Cards</h1><span class="badge" id="version">V14</span><span class="offline" id="offline" hidden>offline — showing cached cards</span></div>
  <p class="sub">Every card in the list, in the colors of the class it was chosen for.
     Art slots are empty until images land in <code>art/</code>.
     The classes themselves live in the <a href="class-bible.html">class bible</a>.</p>
</header>

<div class="bar noprint">
  <div class="field"><label for="f-class">Class</label>
    <select id="f-class"><option value="assigned">All assigned (252)</option>
      <option value="">Everything (755)</option><option value="none">Unassigned</option></select></div>
  <div class="field"><label for="f-type">Type</label><select id="f-type"><option value="">Any</option></select></div>
  <div class="field"><label for="f-cost">Cost</label><select id="f-cost"><option value="">Any</option></select></div>
  <div class="field"><label for="f-text">Search rules text</label><input id="f-text" type="search" placeholder="e.g. exhaust, discard pile"></div>
  <div class="field"><label for="f-print">&nbsp;</label><button id="f-print" class="primary" type="button">Print these cards</button></div>
  <span class="count" id="count"></span>
</div>

<div id="grid" class="grid"></div>
<div id="empty" class="empty" hidden></div>

<script>
const CLASSES = [{"slug": "01-pyromancer","hero": "Caine","name": "Pyromancer","counter": "Flame 🔥","c1": "#D3082F","c2": "#D3082F"},{"slug": "02-chronomancer","hero": "Vesper","name": "Chronomancer","counter": "Time ⏳","c1": "#F5B202","c2": "#F5B202"},{"slug": "03-druid","hero": "Briar","name": "Druid","counter": "Growth 🌿","c1": "#2A8934","c2": "#2A8934"},{"slug": "04-sorceress","hero": "Crystal","name": "Sorceress","counter": "Frost ❄️","c1": "#0189C4","c2": "#0189C4"},{"slug": "05-necromancer","hero": "Viol","name": "Necromancer","counter": "Soul 🪦","c1": "#81377B","c2": "#81377B"},{"slug": "06-warrior","hero": "Hale","name": "Warrior","counter": "Durability 🛡️","c1": "#9FA8B4","c2": "#9FA8B4"},{"slug": "07-wizard","hero": "Arc","name": "Wizard","counter": "Plasma 💥","c1": "#D3082F","c2": "#F5B202"},{"slug": "08-shaman","hero": "Ash","name": "Shaman","counter": "Magma 🌋","c1": "#D3082F","c2": "#2A8934"},{"slug": "09-trinket-mage","hero": "Quench","name": "Trinket-mage","counter": "Charge 🫧","c1": "#D3082F","c2": "#0189C4"},{"slug": "10-warlock","hero": "Brand","name": "Warlock","counter": "Debt ☄️","c1": "#D3082F","c2": "#81377B"},{"slug": "11-demon-hunter","hero": "Kell","name": "Demon Hunter","counter": "Fury 🔺","c1": "#D3082F","c2": "#9FA8B4"},{"slug": "12-windrunner","hero": "Gale","name": "Windrunner","counter": "Terrain 🌎","c1": "#F5B202","c2": "#2A8934"},{"slug": "13-edgedancer","hero": "Prism","name": "Edgedancer","counter": "Facet 💠","c1": "#F5B202","c2": "#0189C4"},{"slug": "14-soulcaster","hero": "Mirren","name": "Soulcaster","counter": "Essence 🔮","c1": "#F5B202","c2": "#81377B"},{"slug": "15-runeblade","hero": "Stave","name": "Runeblade","counter": "Rune ᛞ","c1": "#F5B202","c2": "#9FA8B4"},{"slug": "16-shapeshifter","hero": "Pelt","name": "Shapeshifter","counter": "Feral 🐾","c1": "#2A8934","c2": "#0189C4"},{"slug": "17-witch-doctor","hero": "Mire","name": "Witch Doctor","counter": "Spore 🦠","c1": "#2A8934","c2": "#81377B"},{"slug": "18-ranger","hero": "Fletch","name": "Ranger","counter": "Mark 🎯","c1": "#2A8934","c2": "#9FA8B4"},{"slug": "19-lich","hero": "Rime","name": "Lich","counter": "Web 🕸️","c1": "#0189C4","c2": "#81377B"},{"slug": "20-death-knight","hero": "Pall","name": "Death Knight","counter": "Chill 🧊","c1": "#0189C4","c2": "#9FA8B4"},{"slug": "21-assassin","hero": "Hush","name": "Assassin","counter": "Contract 🗡","c1": "#81377B","c2": "#9FA8B4"}];
const BY_SLUG = Object.fromEntries(CLASSES.map(c => [c.slug, c]));
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const $ = id => document.getElementById(id);
let CARDS = [];

/* Art lands later. A static host has no directory listing, so art/index.json
   names the files that exist; without it we render placeholders and make zero
   requests, rather than firing a 404 per card per extension. */
let ART = {};
function artHTML(c){
  const k = BY_SLUG[c['class']];
  const file = ART[c.id];
  if (file) return `<div class="art"><img alt="" loading="lazy" src="art/${encodeURIComponent(file)}"></div>`;
  const glyph = k ? k.counter.split(' ').pop() : '\u25C7';
  return `<div class="art"><div class="ph"><span class="glyph">${glyph}</span>
    <span class="cid">${esc(c.id)}</span></div></div>`;
}

/* The source gives one number for cost plus a list of aspects, not a printed
   mana string. So the column is derived: one coloured pip per aspect, in the
   class's own two colours, then a single generic pip for whatever cost is
   left. A cost of 8 on a two-aspect card reads as two colours over a 6. */
function pipsHTML(c){
  const k = BY_SLUG[c['class']];
  const cols = k ? [k.c1, k.c2] : ['#6B6879', '#423E55'];
  if (c.cost === null) return '';                     // heroes are not cast
  const coloured = Math.min(c.aspects.length, c.cost);
  const generic = c.cost - coloured;
  const out = [];
  for (let i = 0; i < coloured; i++)
    out.push(`<span class="pip" style="background:${cols[i % 2]}"></span>`);
  if (generic > 0 || c.cost === 0)
    out.push(`<span class="pip generic">${generic}</span>`);
  return `<div class="pips">${out.join('')}</div>`;
}

function cardHTML(c){
  const k = BY_SLUG[c['class']];
  const bg = k ? `linear-gradient(155deg, ${k.c1}, ${k.c2})` : 'linear-gradient(155deg,#6B6879,#423E55)';
  // Two of the six inks are far too light to carry white text on their own, and
  // a blend can pair a light ink with a dark one, so a constant wash sits over
  // the whole banner: the hues stay exact, the title stays legible on all 21.
  const wash = 'linear-gradient(rgba(0,0,0,.40),rgba(0,0,0,.40))';
  const banner = k ? `${wash}, linear-gradient(90deg, ${k.c1} 0 44%, ${k.c2} 56% 100%)`
                   : `${wash}, linear-gradient(90deg,#6B6879 0 44%,#423E55 56% 100%)`;
  // a spell has no power or HP: leave the grid cell empty rather than render an
  // empty shape, which otherwise takes height and squeezes the art
  const isUp = c.type === 'Upgrade';
  const stat = (v, cls) => v === null || v === undefined || isUp
      ? '<span></span>' : `<span class="stat ${cls}">${esc(v)}</span>`;
  const corner = (v, cls, side) => !isUp || v === null || v === undefined
      ? '' : `<span class="stat ${cls} corner ${side}">${esc(v)}</span>`;
  const rules = (c.text || '').split('\n').filter(Boolean).map(l => `<p>${esc(l)}</p>`).join('')
              || '<p style="opacity:.45">No rules text.</p>';
  return `<article class="card${isUp ? ' up' : ''}" style="background:${bg}">
    ${pipsHTML(c)}
    <div class="title" style="background:${banner}">${c.unique ? '<span class="uniq">\u25C6</span>' : ''}${esc(c.name || c.id)}</div>
    ${artHTML(c)}
    <div class="statline">
      ${stat(c.power, 'pow')}
      <span class="mid">${esc(c.type)}${c.keywords.length
          ? `<span class="kws">${esc(c.keywords.join(' \u00B7 '))}</span>` : ''}</span>
      ${stat(c.hp, 'hp')}
    </div>
    <div class="rules">${rules}</div>
    ${corner(c.power, 'pow', 'l')}${corner(c.hp, 'hp', 'r')}
    ${ART[c.id] ? `<div class="credit">art \u00B7 ${esc(ART[c.id])}</div>` : ''}
  </article>`;
}

/* Rules text must fit a fixed box now that the card is a fixed shape. Shrink
   only the cards that overflow, in batched passes so layout is read then
   written rather than thrashed per card. */
function fitRules(root){
  const steps = [1, .94, .88, .82, .76, .70, .64];
  let live = [...root.querySelectorAll('.rules')];
  for (let i = 1; i < steps.length && live.length; i++) {
    live = live.filter(el => el.scrollHeight > el.clientHeight + 1);   // read all
    live.forEach(el => el.style.setProperty('--fit', steps[i]));       // then write all
  }
}

function apply(){
  const cls = $('f-class').value, ty = $('f-type').value, co = $('f-cost').value;
  const q = $('f-text').value.trim().toLowerCase();
  const out = CARDS.filter(c => {
    if (cls === 'assigned' && !c['class']) return false;
    if (cls === 'none' && c['class']) return false;
    if (cls && cls !== 'assigned' && cls !== 'none' && c['class'] !== cls) return false;
    if (ty && c.type !== ty) return false;
    if (co !== '' && String(c.cost) !== co) return false;
    if (q && !(c.text || '').toLowerCase().includes(q)) return false;
    return true;
  });
  $('grid').innerHTML = out.map(cardHTML).join('');
  fitRules($('grid'));
  $('count').textContent = `${out.length} card${out.length === 1 ? '' : 's'}`;
  $('empty').hidden = out.length > 0;
  $('empty').textContent = out.length ? '' : 'No cards match those filters.';
}

Promise.all([
  fetch('card-list.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
  fetch('art/index.json').then(r => r.ok ? r.json() : []).catch(() => [])
]).then(([d, art]) => {
  for (const f of art) ART[String(f).replace(/\.[^.]+$/, '')] = f;
  const order = Object.fromEntries(CLASSES.map((c, i) => [c.slug, i]));
  CARDS = d.data.slice().sort((a, b) =>
      (order[a['class']] ?? 99) - (order[b['class']] ?? 99) ||
      (a.cost ?? -1) - (b.cost ?? -1) || a.id.localeCompare(b.id));
  const sel = $('f-class');
  CLASSES.forEach(c => {
    const n = CARDS.filter(x => x['class'] === c.slug).length;
    sel.insertAdjacentHTML('beforeend', `<option value="${c.slug}">${esc(c.name)} — ${esc(c.hero)} (${n})</option>`);
  });
  [...new Set(CARDS.map(c => c.type))].sort().forEach(t =>
    $('f-type').insertAdjacentHTML('beforeend', `<option>${esc(t)}</option>`));
  [...new Set(CARDS.map(c => c.cost))].sort((a, b) => (a ?? -1) - (b ?? -1)).forEach(c =>
    $('f-cost').insertAdjacentHTML('beforeend', `<option value="${c}">${c === null ? 'none' : c}</option>`));
  ['f-class','f-type','f-cost'].forEach(i => $(i).addEventListener('change', apply));
  $('f-text').addEventListener('input', apply);
  $('f-print').addEventListener('click', () => window.print());
  apply();
}).catch(err => {
  $('empty').hidden = false;
  $('empty').innerHTML = `<b>Could not load card-list.json</b> (${esc(err.message)}).<br>
    This page fetches the card data, which browsers block on <code>file://</code>.
    Serve the folder over HTTP — <code>python3 -m http.server</code> — or view it on the deployed site.`;
});

/* --- staleness control ---------------------------------------------------
   The worker is network-first for everything but art, so an open page already
   shows fresh data. This handles the other half: getting a NEW worker (and so
   a new cache and a new badge) live without waiting for every tab to close. */
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;   // first install needs no refresh
    reloading = true;
    location.reload();                         // a newer release just took over
  });
  addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js',
                    { scope: './', updateViaCache: 'none' });
      reg.update();                            // check for a new release now
