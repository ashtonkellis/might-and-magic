<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Might &amp; Magic — Cards</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#EEEDF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131220" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Palette and type follow class-bible.html so the two read as one project. */
:root{
  --ground:#EEEDF2; --surface:#FBFAFD; --surface-alt:#E5E3EC;
  --ink:#1A1826; --ink-soft:#423E55; --muted:#6B6879;
  --rule:rgba(26,24,38,.13); --rule-strong:rgba(26,24,38,.26); --chip:rgba(26,24,38,.06);
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
  --body:"Karla","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#131220; --surface:#1C1A2B; --surface-alt:#242135;
  --ink:#E9E7F1; --ink-soft:#C3BFD6; --muted:#9A96AE;
  --rule:rgba(233,231,241,.16); --rule-strong:rgba(233,231,241,.32); --chip:rgba(233,231,241,.08);
}}
:root[data-theme="dark"]{
  --ground:#131220; --surface:#1C1A2B; --surface-alt:#242135;
  --ink:#E9E7F1; --ink-soft:#C3BFD6; --muted:#9A96AE;
  --rule:rgba(233,231,241,.16); --rule-strong:rgba(233,231,241,.32); --chip:rgba(233,231,241,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased}

/* ---------- chrome ---------- */
header.top{padding:1.6rem clamp(1rem,4vw,2.5rem) .9rem;display:flex;flex-direction:column;gap:.45rem}
.titlerow{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap}
.badge{font-family:var(--mono);font-size:.7rem;font-weight:700;letter-spacing:.1em;
  border:1px solid var(--rule-strong);border-radius:999px;padding:.16rem .55rem;color:var(--ink-soft);background:var(--chip)}
.offline{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1px dashed var(--rule-strong);border-radius:999px;padding:.14rem .5rem}
.spectrum{height:5px;border-radius:3px;background:linear-gradient(to right,#C8342B,#CE7A16,#2C8C4E,#3256C6,#7A3B9E,#7C5433)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,4vw,2.6rem);margin:.5rem 0 0;letter-spacing:-.02em}
.sub{color:var(--ink-soft);margin:0;max-width:62ch}
.sub a{color:inherit}

.bar{position:sticky;top:0;z-index:10;background:var(--surface);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule-strong);
     padding:.7rem clamp(1rem,4vw,2.5rem);display:flex;flex-wrap:wrap;gap:.55rem .7rem;align-items:center}
.bar label{font-family:var(--mono);font-size:.62rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.2rem}
.field{display:flex;flex-direction:column}
select,input[type=search],button{font-family:var(--body);font-size:.92rem;color:var(--ink);background:var(--ground);
     border:1px solid var(--rule-strong);border-radius:4px;padding:.36rem .5rem}
input[type=search]{min-width:15rem}
button{cursor:pointer;font-weight:700}
button:hover{background:var(--surface-alt)}
button.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
:is(select,input,button):focus-visible{outline:2px solid #3256C6;outline-offset:2px}
.count{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-left:auto}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem;
      padding:1.2rem clamp(1rem,4vw,2.5rem)4rem}
.empty{padding:3rem clamp(1rem,4vw,2.5rem);color:var(--muted)}

/* ---------- the card ---------- */
.card{border-radius:9px;overflow:hidden;display:flex;flex-direction:column;
      color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);position:relative}
.card .head{display:flex;align-items:center;gap:.4rem;padding:.38rem .45rem;font-family:var(--mono);font-size:.6rem;
      letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.22)}
.cost{font-family:var(--display);font-weight:700;font-size:.95rem;line-height:1;background:rgba(255,255,255,.92);
      color:#141018;border-radius:50%;width:1.45rem;height:1.45rem;display:grid;place-items:center;flex:none}
.klass{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uniq{margin-left:auto;flex:none;opacity:.9}
.art{aspect-ratio:5/3;flex:0 0 auto;background:rgba(0,0,0,.16);display:grid;place-items:center;overflow:hidden;position:relative}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid;place-items:center;gap:.15rem;text-align:center;opacity:.5;padding:.3rem}
.ph .glyph{font-size:1.5rem;line-height:1}
.ph .cid{font-family:var(--mono);font-size:.5rem;letter-spacing:.08em}
.meta{background:rgba(0,0,0,.3);padding:.3rem .45rem;font-family:var(--mono);font-size:.55rem;
      letter-spacing:.05em;text-transform:uppercase;display:flex;gap:.35rem}
.meta .kw{margin-left:auto;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none;letter-spacing:0}
.rules{flex:1 1 auto;background:rgba(255,255,255,.94);color:#1A1826;font-size:.6rem;line-height:1.32;
      padding:.4rem .45rem 1.15rem;min-height:4.4em}
.rules p{margin:0 0 .28em}
.rules p:last-child{margin:0}
.stats{position:absolute;right:.4rem;bottom:.32rem;font-family:var(--display);font-weight:700;font-size:.78rem;
      background:rgba(0,0,0,.55);border-radius:4px;padding:.05rem .34rem;letter-spacing:.03em}

/* ---------- print: real 2.5in x 3.5in cards, 9 to a letter page ---------- */
@page{size:letter portrait;margin:.2in}
@media print{
  :root{--ink:#000;--ink-soft:#000}
  header.top,.bar,.empty,.noprint{display:none!important}
  body{background:#fff}
  .grid{display:grid;grid-template-columns:repeat(3,2.5in);gap:0;padding:0;justify-content:center}
  .card{width:2.5in;height:3.5in;aspect-ratio:auto;border-radius:0;box-shadow:none;
        outline:.5pt dashed rgba(0,0,0,.35);outline-offset:-.5pt;break-inside:avoid;page-break-inside:avoid;
        -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .art{aspect-ratio:auto;flex:1 1 auto;min-height:0}
  .rules{font-size:6.6pt;line-height:1.25;min-height:0;flex:0 0 auto;max-height:1.5in;overflow:hidden;
         padding:.06in .07in .17in}
  .meta{font-size:6pt}
  .card .head{font-size:7pt}
}
</style>
</head>
<body>

<header class="top">
  <div class="spectrum"></div>
  <div class="titlerow"><h1>Cards</h1><span class="badge" id="version">V2</span><span class="offline" id="offline" hidden>offline — showing cached cards</span></div>
  <p class="sub">Every card in the list, in the colors of the class it was chosen for.
     Art slots are empty until images land in <code>art/</code>.
     The classes themselves live in the <a href="class-bible.html">class bible</a>.</p>
</header>

<div class="bar noprint">
  <div class="field"><label for="f-class">Class</label>
    <select id="f-class"><option value="assigned">All assigned (252)</option>
      <option value="">Everything (755)</option><option value="none">Unassigned</option></select></div>
  <div class="field"><label for="f-type">Type</label><select id="f-type"><option value="">Any</option></select></div>
  <div class="field"><label for="f-cost">Cost</label><select id="f-cost"><option value="">Any</option></select></div>
  <div class="field"><label for="f-text">Search rules text</label><input id="f-text" type="search" placeholder="e.g. exhaust, discard pile"></div>
  <div class="field"><label for="f-print">&nbsp;</label><button id="f-print" class="primary" type="button">Print these cards</button></div>
  <span class="count" id="count"></span>
</div>

<div id="grid" class="grid"></div>
<div id="empty" class="empty" hidden></div>

<script>
const CLASSES = [{"slug": "01-pyromancer","hero": "Caine","name": "Pyromancer","counter": "Flame 🔥","c1": "#C8342B","c2": "#C8342B"},{"slug": "02-chronomancer","hero": "Vesper","name": "Chronomancer","counter": "Time ⏳","c1": "#CE7A16","c2": "#CE7A16"},{"slug": "03-druid","hero": "Briar","name": "Druid","counter": "Growth 🌿","c1": "#2C8C4E","c2": "#2C8C4E"},{"slug": "04-sorceress","hero": "Crystal","name": "Sorceress","counter": "Frost ❄️","c1": "#3256C6","c2": "#3256C6"},{"slug": "05-necromancer","hero": "Viol","name": "Necromancer","counter": "Soul 🪦","c1": "#7A3B9E","c2": "#7A3B9E"},{"slug": "06-warrior","hero": "Hale","name": "Warrior","counter": "Durability 🛡️","c1": "#7C5433","c2": "#7C5433"},{"slug": "07-wizard","hero": "Arc","name": "Wizard","counter": "Plasma 💥","c1": "#C8342B","c2": "#CE7A16"},{"slug": "08-shaman","hero": "Ash","name": "Shaman","counter": "Magma 🌋","c1": "#C8342B","c2": "#2C8C4E"},{"slug": "09-trinket-mage","hero": "Quench","name": "Trinket-mage","counter": "Charge 🫧","c1": "#C8342B","c2": "#3256C6"},{"slug": "10-warlock","hero": "Brand","name": "Warlock","counter": "Debt ☄️","c1": "#C8342B","c2": "#7A3B9E"},{"slug": "11-demon-hunter","hero": "Kell","name": "Demon Hunter","counter": "Fury 🔺","c1": "#C8342B","c2": "#7C5433"},{"slug": "12-windrunner","hero": "Gale","name": "Windrunner","counter": "Terrain 🌎","c1": "#CE7A16","c2": "#2C8C4E"},{"slug": "13-edgedancer","hero": "Prism","name": "Edgedancer","counter": "Facet 💠","c1": "#CE7A16","c2": "#3256C6"},{"slug": "14-soulcaster","hero": "Mirren","name": "Soulcaster","counter": "Essence 🔮","c1": "#CE7A16","c2": "#7A3B9E"},{"slug": "15-runeblade","hero": "Stave","name": "Runeblade","counter": "Rune ᛞ","c1": "#CE7A16","c2": "#7C5433"},{"slug": "16-shapeshifter","hero": "Pelt","name": "Shapeshifter","counter": "Feral 🐾","c1": "#2C8C4E","c2": "#3256C6"},{"slug": "17-witch-doctor","hero": "Mire","name": "Witch Doctor","counter": "Spore 🦠","c1": "#2C8C4E","c2": "#7A3B9E"},{"slug": "18-ranger","hero": "Fletch","name": "Ranger","counter": "Mark 🎯","c1": "#2C8C4E","c2": "#7C5433"},{"slug": "19-lich","hero": "Rime","name": "Lich","counter": "Web 🕸️","c1": "#3256C6","c2": "#7A3B9E"},{"slug": "20-death-knight","hero": "Pall","name": "Death Knight","counter": "Chill 🧊","c1": "#3256C6","c2": "#7C5433"},{"slug": "21-assassin","hero": "Hush","name": "Assassin","counter": "Contract 🗡","c1": "#7A3B9E","c2": "#7C5433"}];
const BY_SLUG = Object.fromEntries(CLASSES.map(c => [c.slug, c]));
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const $ = id => document.getElementById(id);
let CARDS = [];

/* Art lands later. A static host has no directory listing, so art/index.json
   names the files that exist; without it we render placeholders and make zero
   requests, rather than firing a 404 per card per extension. */
let ART = {};
function artHTML(c){
  const k = BY_SLUG[c['class']];
  const file = ART[c.id];
  if (file) return `<div class="art"><img alt="" loading="lazy" src="art/${encodeURIComponent(file)}"></div>`;
  const glyph = k ? k.counter.split(' ').pop() : '\u25C7';
  return `<div class="art"><div class="ph"><span class="glyph">${glyph}</span>
    <span class="cid">${esc(c.id)}</span></div></div>`;
}

function cardHTML(c){
  const k = BY_SLUG[c['class']];
  const bg = k ? `linear-gradient(150deg, ${k.c1}, ${k.c2})` : 'linear-gradient(150deg,#6B6879,#423E55)';
  const cost = c.cost === null ? '—' : c.cost;
  const stats = c.power !== null && c.hp !== null ? `${c.power}/${c.hp}`
              : (c.hp !== null ? `${c.hp} HP` : '');
  const rules = (c.text || '').split('\n').filter(Boolean).map(l => `<p>${esc(l)}</p>`).join('') ||
                '<p style="opacity:.45">No rules text.</p>';
  return `<article class="card" style="background:${bg}">
    <div class="head"><span class="cost">${esc(cost)}</span>
      <span class="klass">${esc(k ? k.name : 'Unassigned')}</span>
      ${c.unique ? '<span class="uniq">◆</span>' : ''}</div>
    ${artHTML(c)}
    <div class="meta"><span>${esc(c.type)}</span>${c.keywords.length ? `<span class="kw">${esc(c.keywords.join(' · '))}</span>` : ''}</div>
    <div class="rules">${rules}</div>
    ${stats ? `<span class="stats">${esc(stats)}</span>` : ''}
  </article>`;
}

function apply(){
  const cls = $('f-class').value, ty = $('f-type').value, co = $('f-cost').value;
  const q = $('f-text').value.trim().toLowerCase();
  const out = CARDS.filter(c => {
    if (cls === 'assigned' && !c['class']) return false;
    if (cls === 'none' && c['class']) return false;
    if (cls && cls !== 'assigned' && cls !== 'none' && c['class'] !== cls) return false;
    if (ty && c.type !== ty) return false;
    if (co !== '' && String(c.cost) !== co) return false;
    if (q && !(c.text || '').toLowerCase().includes(q)) return false;
    return true;
  });
  $('grid').innerHTML = out.map(cardHTML).join('');
  $('count').textContent = `${out.length} card${out.length === 1 ? '' : 's'}`;
  $('empty').hidden = out.length > 0;
  $('empty').textContent = out.length ? '' : 'No cards match those filters.';
}

Promise.all([
  fetch('card-list.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
  fetch('art/index.json').then(r => r.ok ? r.json() : []).catch(() => [])
]).then(([d, art]) => {
  for (const f of art) ART[String(f).replace(/\.[^.]+$/, '')] = f;
  const order = Object.fromEntries(CLASSES.map((c, i) => [c.slug, i]));
  CARDS = d.data.slice().sort((a, b) =>
      (order[a['class']] ?? 99) - (order[b['class']] ?? 99) ||
      (a.cost ?? -1) - (b.cost ?? -1) || a.id.localeCompare(b.id));
  const sel = $('f-class');
  CLASSES.forEach(c => {
    const n = CARDS.filter(x => x['class'] === c.slug).length;
    sel.insertAdjacentHTML('beforeend', `<option value="${c.slug}">${esc(c.name)} — ${esc(c.hero)} (${n})</option>`);
  });
  [...new Set(CARDS.map(c => c.type))].sort().forEach(t =>
    $('f-type').insertAdjacentHTML('beforeend', `<option>${esc(t)}</option>`));
  [...new Set(CARDS.map(c => c.cost))].sort((a, b) => (a ?? -1) - (b ?? -1)).forEach(c =>
    $('f-cost').insertAdjacentHTML('beforeend', `<option value="${c}">${c === null ? 'none' : c}</option>`));
  ['f-class','f-type','f-cost'].forEach(i => $(i).addEventListener('change', apply));
  $('f-text').addEventListener('input', apply);
  $('f-print').addEventListener('click', () => window.print());
  apply();
}).catch(err => {
  $('empty').hidden = false;
  $('empty').innerHTML = `<b>Could not load card-list.json</b> (${esc(err.message)}).<br>
    This page fetches the card data, which browsers block on <code>file://</code>.
    Serve the folder over HTTP — <code>python3 -m http.server</code> — or view it on the deployed site.`;
});

/* --- staleness control ---------------------------------------------------
   The worker is network-first for everything but art, so an open page already
   shows fresh data. This handles the other half: getting a NEW worker (and so
   a new cache and a new badge) live without waiting for every tab to close. */
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;   // first install needs no refresh
    reloading = true;
    location.reload();                         // a newer release just took over
  });
  addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js',
                    { scope: './', updateViaCache: 'none' });
      reg.update();                            // check for a new release now
      setInterval(() => reg.update(), 60 * 60 * 1000);
    } catch (e) { /* offline, or unsupported: the page still works */ }
  });
}
const setOnline = () => { $('offline').hidden = navigator.onLine; };
addEventListener('online', setOnline); addEventListener('offline', setOnline); setOnline();
</script>
</body>
</html>
